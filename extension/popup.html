<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabfold</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><span class="brand"><span class="mark" aria-hidden="true">▰</span>tabfold</span><button id="settings" class="quiet" data-i18n="Settings">Settings</button></header>
<section class="controls"><div class="quick-options"><label><input id="allWindows" type="checkbox"><span data-i18n="All windows">All windows</span></label><label><input id="regroup" type="checkbox"><span data-i18n="Regroup existing groups">Regroup existing groups</span></label><label data-i18n-title="Skip saved AI categories without deleting them." title="Skip saved AI categories without deleting them."><input id="ignoreCategories" type="checkbox"><span data-i18n="Ignore saved categories">Ignore saved categories</span><small>AI</small></label><label><input id="suggestNew" type="checkbox" checked><span data-i18n="Suggest new categories">Suggest new categories</span><small>AI</small></label><label class="existing-name-option" style="grid-column:1/-1" data-i18n-title="Use existing group names when classifying tabs, even when regrouping." title="Use existing group names when classifying tabs, even when regrouping."><input id="useExistingGroups" type="checkbox" checked><span data-i18n="Use existing group names">Use existing group names</span></label></div><div class="preview-actions"><button id="refresh" data-i18n="Quick preview">Quick preview</button><button id="aiPreview" data-i18n="AI preview">AI preview</button></div></section>
<section class="stats"><div><strong id="total">—</strong><span data-i18n="Tabs">Tabs</span></div><div><strong id="groupCount">—</strong><span data-i18n="Changes">Changes</span></div><div><strong id="duplicateCount">—</strong><span data-i18n="Duplicates">Duplicates</span></div></section>
<main id="results"><details id="existingSection" class="existing-section" open><summary class="section-title"><h2 data-i18n="Existing groups">Existing groups</h2><span id="existingCount"></span></summary><div id="existingGroups"></div><p id="noExisting" data-i18n="No existing groups in this scope.">No existing groups in this scope.</p></details><details id="excluded"><summary id="excludedSummary"></summary><p id="groupedReason"></p><p id="otherProtectedReason"></p></details><div class="section-title"><h1 data-i18n="Proposed changes">Proposed changes</h1></div><div id="groups"></div><p id="empty" hidden data-i18n="No groups to create. Try AI preview or another window.">No groups to create. Try AI preview or another window.</p><section id="suggestionsSection" hidden><h2 data-i18n="Suggested categories">Suggested categories</h2><div id="suggestionRows"></div></section><section id="duplicateReview" hidden><h2 data-i18n="Review duplicates">Review duplicates</h2><p data-i18n="These tabs have identical addresses. Closing them loses unsaved edits.">These tabs have identical addresses. Closing them loses unsaved edits.</p><ul id="duplicateList"></ul><button id="dedupe" class="danger" data-i18n="Close these duplicates">Close these duplicates</button></section></main>
<footer><p id="groupingModeNotice" class="mode-notice" role="note"></p><label class="collapse"><input id="collapse" type="checkbox" checked><span data-i18n="Collapse groups">Collapse groups</span><span class="hint" data-i18n="No tabs closed">No tabs closed</span></label><button id="apply" class="primary" disabled data-i18n="Apply groups">Apply groups</button><div class="secondary"><button id="undo" disabled data-i18n="Undo grouping">Undo grouping</button><button id="duplicates" disabled data-i18n="Review duplicates">Review duplicates</button></div><button id="restore" class="quiet restore" data-i18n="Restore closed duplicate URLs">Restore closed duplicate URLs</button><p id="status" role="status" aria-live="polite" data-i18n="Reading your tabs…">Reading your tabs…</p></footer>
<script type="module" src="popup.js"></script></body></html>
