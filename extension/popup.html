<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabfold</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><span class="brand"><span class="mark" aria-hidden="true">▰</span>tabfold</span><button id="settings" class="quiet" data-i18n="Settings">Settings</button></header>
<section class="controls"><div class="scope-row"><label for="scope" data-i18n="Organize">Organize</label><select id="scope"><option value="current" data-i18n="This window">This window</option><option value="all" data-i18n="All windows">All windows</option></select></div><div class="preview-actions"><button id="refresh" data-i18n="Quick preview">Quick preview</button><button id="aiPreview" data-i18n="AI preview">AI preview</button></div></section>
<section class="stats"><div><strong id="total">—</strong><span data-i18n="Tabs">Tabs</span></div><div><strong id="groupCount">—</strong><span data-i18n="Groups">Groups</span></div><div><strong id="duplicateCount">—</strong><span data-i18n="Duplicates">Duplicates</span></div></section>
<main id="results"><div class="section-title"><h1 data-i18n="Preview">Preview</h1><span id="protected"></span></div><div id="groups"></div><p id="empty" hidden data-i18n="No groups to create. Try AI preview or another window.">No groups to create. Try AI preview or another window.</p><section id="suggestionsSection" hidden><h2 data-i18n="Suggested categories">Suggested categories</h2><div id="suggestionRows"></div></section><section id="duplicateReview" hidden><h2 data-i18n="Review duplicates">Review duplicates</h2><p data-i18n="These tabs have identical addresses. Closing them loses unsaved edits.">These tabs have identical addresses. Closing them loses unsaved edits.</p><ul id="duplicateList"></ul><button id="dedupe" class="danger" data-i18n="Close these duplicates">Close these duplicates</button></section></main>
<footer><label class="collapse"><input id="collapse" type="checkbox" checked><span data-i18n="Collapse groups">Collapse groups</span><span class="hint" data-i18n="No tabs closed">No tabs closed</span></label><button id="apply" class="primary" disabled data-i18n="Apply groups">Apply groups</button><div class="secondary"><button id="undo" disabled data-i18n="Undo grouping">Undo grouping</button><button id="duplicates" disabled data-i18n="Review duplicates">Review duplicates</button></div><button id="restore" class="quiet restore" data-i18n="Restore closed duplicate URLs">Restore closed duplicate URLs</button><p id="status" role="status" aria-live="polite" data-i18n="Reading your tabs…">Reading your tabs…</p></footer>
<script type="module" src="popup.js"></script></body></html>
